# Settings for the motion example (-e=1) with optional ruCLIP classification.
#
# Build the tracker with -DUSE_CLIP=ON and run:
#   MultitargetTracker.exe ../data/towncentre.mp4 -e=1 --settings=../data/settings_motion_clip.ini
#
# The [tracking] section mirrors the defaults the motion example uses when no
# settings file is given, so enabling this ini does not change tracking much.

[tracking]
# DistCenters = 0   // Euclidean distance between centers, pixels
# DistRects = 1     // Euclidean distance between bounding rectangles, pixels
# DistJaccard = 2   // Intersection over Union, IoU, [0, 1]
distance_type = 0

# KalmanLinear = 0, KalmanUnscented = 1
kalman_type = 0

# FilterCenter = 0, FilterRect = 1, FilterRRect = 2
filter_goal = 0

# TrackNone = 0
lost_track_type = 0

# MatchHungrian = 0, MatchBipart = 1
match_type = 0

use_aceleration = 0
delta_time = 0.3
accel_noise = 0.1
dist_thresh = 0.95
min_area_radius_pix = -1
min_area_radius_k = 0.8
max_lost_time = 2
max_trace_len = 2
detect_abandoned = 0

[clip]
# Directory with the ruCLIP model: config.json, bpe.model and the ONNX files
# clip_visual.onnx / clip_textual.onnx (TensorRT backend). Empty disables
# classification.
model_dir = C:/work/clip/ruclip/CLIP/data/ruclip-vit-large-patch14-336

# Positive class prompts (UTF-8, ';'-separated; do not put spaces around ';').
labels = pedestrian;car;truck;bus;bicycle

# Catch-all "unknown" prompt. A prediction of this label, or a confidence below
# `threshold`, rejects the object and draws no label.
reject_label = another
threshold = 0.5

# Backend: trt | torch | dnn
backend = trt

# FP16 inference (TensorRT engine / LibTorch CUDA).
use_fp16 = 1

# Upper bound of one inference call (TensorRT optimization profile).
max_batch = 32
device_index = 0

# Classify a new track once, then re-check it every N frames.
recheck_interval = 30

# Crops smaller than this (pixels) are not classified.
min_object_width = 16
min_object_height = 16
