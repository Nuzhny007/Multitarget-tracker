[detection]

#-----------------------------
# opencv_dnn = 6
# tensorrt = 5
# YOLO11 with a rectangular input (736x1280) fails in OpenCV DNN
# (NaryEltwise with transposed shapes), so MOT20 runs on TensorRT.
detector_backend = 5

#-----------------------------
# Target and backend for opencv_dnn detector (used when detector_backend = 6)
ocv_dnn_target = DNN_TARGET_CUDA
ocv_dnn_backend = DNN_BACKEND_CUDA

#-----------------------------
# YOLO11s on COCO (person only via white_list) for MOT20 (1920x1080,
# 16:9), exported at 736x1280.
nn_weights = C:/work/home/mtracker/Multitarget-tracker/data/coco/yolo11s_1280x736.onnx
nn_config = C:/work/home/mtracker/Multitarget-tracker/data/coco/yolo11s_1280x736.onnx
class_names = C:/work/home/mtracker/Multitarget-tracker/data/coco/coco.names
white_list = person

#-----------------------------
confidence_threshold = 0.3

max_crop_ratio = -1
max_batch = 1
gpu_id = 0

#-----------------------------
net_type = YOLOV11

#-----------------------------
# INT8
# FP16
# FP32
inference_precision = FP32

[tracking]

#-----------------------------
# UniversalTracker = 0
# ByteTrack = 1

tracker_type = 1

#-----------------------------
# DistCenters = 0   // Euclidean distance between centers, pixels
# DistRects = 1     // Euclidean distance between bounding rectangles, pixels
# DistJaccard = 2   // Intersection over Union, IoU, [0, 1]
# DistHist = 3      // Bhatacharia distance between histograms, [0, 1]

distance_type = 0

#-----------------------------
# KalmanLinear = 0
# KalmanUnscented = 1

kalman_type = 0

#-----------------------------
# FilterCenter = 0
# FilterRect = 1
# FilterRRect = 2

filter_goal = 0

#-----------------------------
# TrackNone = 0
# TrackKCF = 1
# TrackMIL = 2
# TrackMedianFlow = 3
# TrackGOTURN = 4
# TrackMOSSE = 5
# TrackCSRT = 6
# TrackDAT = 7
# TrackSTAPLE = 8
# TrackLDES = 9
# TrackDaSiamRPN = 10
# Used if filter_goal == FilterRect

lost_track_type = 0

#-----------------------------
# MatchHungrian = 0
# MatchLAPJV = 1

match_type = 1

#-----------------------------
# ByteTrack-only settings (used when tracker_type = ByteTrack):
#   track_buffer  - frames a lost track is kept alive
#   track_thresh  - detections with conf >= this join the first association
#   high_thresh   - a new track is created only for conf >= this
#   match_thresh  - IoU gate for the first association
# Tuned for MOT20 (dense crowd, conf 0.3): lower than the VisDrone config
# (0.5/0.5) so low-confidence crowd detections can open new tracks.
bytetrack_track_buffer = 30
bytetrack_track_thresh = 0.3
bytetrack_high_thresh = 0.3
bytetrack_match_thresh = 0.8

#-----------------------------
# Use constant acceleration motion model:
# 0 - unused (stable)
# 1 - use acceleration in Kalman filter (experimental)
use_aceleration = 0

#-----------------------------
# Delta time for Kalman filter
delta_time = 0.4

#-----------------------------
# Accel noise magnitude for Kalman filter
accel_noise = 0.2

#-----------------------------
# Distance threshold between region and object on two frames
dist_thresh = 0.8

#-----------------------------
# If this value > 0 than will be used circle with this radius
# If this value <= 0 than will be used ellipse with size (3*vx, 3*vy), vx and vy - horizontal and vertical speed in pixelsa
min_area_radius_pix = -1

#-----------------------------
# Minimal area radius in ration for object size. Used if min_area_radius_pix < 0
min_area_radius_k = 0.8

#-----------------------------
# If the object do not assignment more than this seconds then it will be removed
max_lost_time = 2

#-----------------------------
# The maximum trajectory length
max_trace_len = 2

#-----------------------------
# Detection abandoned objects
detect_abandoned = 0
# After this time (in seconds) the object is considered abandoned
min_static_time = 5
# After this time (in seconds) the abandoned object will be removed
max_static_time = 25
# Speed in pixels. If speed of object is more that this value than object is non static
max_speed_for_static = 10
